name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Every case, with no agent, scored against the stored
      # baseline; the step fails when any score drops.
      - run: npm run eval
      # The sandboxed run's live suite starts real containers through
      # the runner's Docker, so it runs here and on explicit opt-in only,
      # never in the default checks.
      - run: npm run test:sandbox
      # The extension integration tests run in CI only, under xvfb; the
      # default checks exclude them so no local run launches anything that
      # could open a VS Code window on a developer machine. The real-host
      # test downloads a VS Code and runs the extension inside it.
      - run: xvfb-run -a npm run test:integration
      - run: xvfb-run -a npm run test:real-host

  # The package build and its smoke checks live in the shared Package
  # workflow (issue #100), so the release of a version tag builds and
  # checks exactly the same package a pull request does.
  package:
    uses: ./.github/workflows/package.yml
